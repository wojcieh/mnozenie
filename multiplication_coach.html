<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Szybkie Mnożenie Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Zapobieganie przewijaniu "bounce" na iOS */
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        /* Efekt wciśnięcia przycisku */
        .btn-active:active {
            transform: scale(0.95);
            background-color: #cbd5e1;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

    <div id="appHeader" class="shrink-0 flex justify-between items-center p-3 bg-white shadow-sm border-b border-gray-200 z-10">
        <h1 class="text-lg font-bold text-[#45B7D1] leading-tight">Mnożenie <span class="text-xs text-gray-400 block font-normal">Zakres 2-9</span></h1>
        <div class="flex items-center space-x-3">
            <div class="bg-gray-100 px-3 py-1 rounded-full">
                <i class="fas fa-stopwatch text-red-500 mr-1 text-sm"></i>
                <span id="timerDisplay" class="font-bold text-gray-800 text-lg tabular-nums">60</span><span class="text-xs text-gray-500">s</span>
            </div>
            <div class="bg-yellow-50 px-3 py-1 rounded-full border border-yellow-100">
                <i class="fas fa-star text-yellow-500 mr-1 text-sm"></i>
                <span id="scoreDisplay" class="font-bold text-gray-800 text-lg tabular-nums">0</span>
            </div>
        </div>
    </div>

    <div id="appContent" class="flex-grow flex flex-col relative overflow-hidden">
        <div class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-[#f0f4f8] z-20">
            <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6 text-[#45B7D1]">
                    <i class="fas fa-mobile-alt text-4xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Tryb Mobilny</h2>
                <p class="text-gray-500 mb-8">Wybieraj wynik z planszy. Masz 60 sekund!</p>
                <button id="startBtn" class="w-full py-4 bg-green-500 text-white rounded-xl font-bold shadow-lg hover:bg-green-600 active:scale-95 transition-all text-xl">
                    START
                </button>
            </div>
        </div>
    </div>

    <script>
        // === KONFIGURACJA ===
        const MIN_FACTOR = 2;
        const MAX_FACTOR = 9;
        const DIAGNOSIS_TIME_SECONDS = 60;

        // Generowanie unikalnych wyników dla planszy (tylko poprawne iloczyny)
        const POSSIBLE_RESULTS = new Set();
        for (let i = MIN_FACTOR; i <= MAX_FACTOR; i++) {
            for (let j = MIN_FACTOR; j <= MAX_FACTOR; j++) {
                POSSIBLE_RESULTS.add(i * j);
            }
        }
        // Sortujemy rosnąco do wyświetlenia na siatce
        const SORTED_RESULTS = Array.from(POSSIBLE_RESULTS).sort((a, b) => a - b);

        let STATE = {
            progress: {},
            currentProblem: { a: 0, b: 0, result: 0 },
            totalScore: 0,
            timer: null,
            timeLeft: DIAGNOSIS_TIME_SECONDS,
            isDiagnosisPhase: true,
            phaseName: 'Diagnoza',
            isProcessing: false // Blokada klikania podczas animacji
        };

        // --- LOGIKA GRY ---

        function generateNewProblem() {
            STATE.isProcessing = false;
            let problemsPool = [];

            for (let a = MIN_FACTOR; a <= MAX_FACTOR; a++) {
                for (let b = MIN_FACTOR; b <= MAX_FACTOR; b++) {
                    const key = `${a}x${b}`;
                    const stats = STATE.progress[key] || { correct: 0, attempts: 0 };
                    STATE.progress[key] = stats;
                    
                    let difficultyScore = 1;
                    if (stats.attempts > 0) {
                        const errorRate = 1 - (stats.correct / stats.attempts);
                        difficultyScore = Math.ceil(errorRate * 10) || 1; 
                    }
                    
                    if (STATE.isDiagnosisPhase) {
                        problemsPool.push({ a, b });
                    } else {
                        // Trening: ważone prawdopodobieństwo
                        for (let i = 0; i < difficultyScore; i++) {
                             problemsPool.push({ a, b });
                        }
                    }
                }
            }

            // Losowanie
            const selectedProblem = problemsPool[Math.floor(Math.random() * problemsPool.length)] || { a: 2, b: 2 };
            
            STATE.currentProblem.a = selectedProblem.a;
            STATE.currentProblem.b = selectedProblem.b;
            STATE.currentProblem.result = selectedProblem.a * selectedProblem.b;
            
            updateProblemDisplay();
            resetGridColors();
        }

        function checkAnswer(selectedNumber, buttonElement) {
            if (STATE.isProcessing) return;
            STATE.isProcessing = true; // Blokada

            const { a, b, result } = STATE.currentProblem;
            const key = `${a}x${b}`;

            if (!STATE.progress[key]) STATE.progress[key] = { correct: 0, attempts: 0 };
            STATE.progress[key].attempts += 1;

            if (selectedNumber === result) {
                // DOBRZE
                STATE.progress[key].correct += 1;
                STATE.totalScore += 1;
                updateScoreDisplay();
                
                // Efekt wizualny na przycisku
                buttonElement.classList.remove('bg-white', 'text-gray-700');
                buttonElement.classList.add('bg-green-500', 'text-white', 'scale-110', 'shadow-green-300');
                
                setTimeout(() => {
                    generateNewProblem();
                }, 400); // Szybkie przejście

            } else {
                // ŹLE
                // Podświetl błędny na czerwono
                buttonElement.classList.remove('bg-white', 'text-gray-700');
                buttonElement.classList.add('bg-red-500', 'text-white', 'shake-animation');
                
                // Znajdź i podświetl poprawny na zielono (podpowiedź)
                const correctBtn = document.querySelector(`button[data-value="${result}"]`);
                if(correctBtn) {
                    correctBtn.classList.add('bg-green-100', 'text-green-700', 'border-green-500');
                }

                setTimeout(() => {
                    generateNewProblem();
                }, 1000); // Dłuższa chwila na analizę błędu
            }
        }

        // --- RENDEROWANIE I UI ---

        function renderGameInterface() {
            const content = document.getElementById('appContent');
            content.innerHTML = `
                <div class="shrink-0 py-4 flex flex-col items-center justify-center bg-white shadow-sm z-10 relative">
                    <div class="text-sm text-gray-400 font-semibold tracking-wider uppercase mb-1">${STATE.phaseName}</div>
                    <div class="text-6xl font-black text-gray-800 flex items-center">
                        <span class="text-[#45B7D1]">${STATE.currentProblem.a}</span>
                        <span class="text-gray-300 mx-2 text-4xl">&times;</span>
                        <span class="text-[#45B7D1]">${STATE.currentProblem.b}</span>
                        <span class="text-gray-300 mx-2 text-4xl">=</span>
                        <span class="text-gray-200">?</span>
                    </div>
                </div>

                <div class="flex-grow bg-slate-100 p-2 overflow-y-auto">
                    <div class="grid grid-cols-5 gap-2 h-full content-center max-w-md mx-auto" id="resultsGrid">
                        </div>
                </div>
            `;

            const grid = document.getElementById('resultsGrid');
            SORTED_RESULTS.forEach(num => {
                const btn = document.createElement('button');
                btn.className = `
                    bg-white text-gray-700 font-bold text-xl rounded-lg shadow-sm border-b-2 border-gray-200 
                    active:border-b-0 active:translate-y-[2px] transition-all duration-75 
                    flex items-center justify-center aspect-square select-none
                `;
                btn.dataset.value = num;
                btn.textContent = num;
                
                // Obsługa dotyku (Touch Start dla szybszej reakcji niż Click)
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Zapobiega podwójnemu odpaleniu click
                    checkAnswer(num, btn);
                }, {passive: false});

                // Fallback dla myszki
                btn.onclick = () => checkAnswer(num, btn);

                grid.appendChild(btn);
            });
            
            updateProblemDisplay();
        }

        function updateProblemDisplay() {
            // Funkcja pomocnicza, jeśli chcielibyśmy aktualizować tylko górną część bez przeładowania gridu
            const display = document.querySelector('.text-6xl');
            if(display) {
                display.innerHTML = `
                    <span class="text-[#45B7D1]">${STATE.currentProblem.a}</span>
                    <span class="text-gray-300 mx-2 text-4xl">&times;</span>
                    <span class="text-[#45B7D1]">${STATE.currentProblem.b}</span>
                    <span class="text-gray-300 mx-2 text-4xl">=</span>
                    <span class="text-gray-300">?</span>
                `;
            }
        }

        function resetGridColors() {
            const buttons = document.querySelectorAll('#resultsGrid button');
            buttons.forEach(btn => {
                btn.className = `
                    bg-white text-gray-700 font-bold text-xl rounded-lg shadow-sm border-b-2 border-gray-200 
                    active:border-b-0 active:translate-y-[2px] transition-all duration-75 
                    flex items-center justify-center aspect-square select-none
                `;
            });
        }

        function updateScoreDisplay() {
            const el = document.getElementById('scoreDisplay');
            if(el) el.textContent = STATE.totalScore;
        }

        // --- ZARZĄDZANIE CZASEM I FAZAMI ---

        function startTimer() {
            if (STATE.timer) clearInterval(STATE.timer);
            const timerEl = document.getElementById('timerDisplay');
            
            STATE.timer = setInterval(() => {
                STATE.timeLeft -= 1;
                if(timerEl) timerEl.textContent = STATE.timeLeft;

                if (STATE.timeLeft <= 0) {
                    clearInterval(STATE.timer);
                    endPhase();
                }
            }, 1000);
        }

        function startDiagnosis() {
            STATE.totalScore = 0;
            STATE.timeLeft = DIAGNOSIS_TIME_SECONDS;
            STATE.isDiagnosisPhase = true;
            STATE.phaseName = 'Diagnoza';
            STATE.progress = {};
            
            renderGameInterface();
            generateNewProblem();
            startTimer();
            updateScoreDisplay();
        }

        function startTargetedTraining() {
            STATE.totalScore = 0;
            STATE.timeLeft = DIAGNOSIS_TIME_SECONDS;
            STATE.isDiagnosisPhase = false;
            STATE.phaseName = 'Trening';
            
            renderGameInterface();
            generateNewProblem();
            startTimer();
            updateScoreDisplay();
        }

        function endPhase() {
            const content = document.getElementById('appContent');
            const summary = summarizeProgress();
            
            let btnText = STATE.isDiagnosisPhase ? 'Rozpocznij Trening' : 'Nowa Diagnoza';
            let nextAction = STATE.isDiagnosisPhase ? startTargetedTraining : startDiagnosis;

            content.innerHTML = `
                <div class="flex-grow flex flex-col items-center justify-center p-6 bg-[#f0f4f8] text-center">
                    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Koniec czasu!</h2>
                        <div class="text-5xl font-black text-[#45B7D1] mb-4">${STATE.totalScore} <span class="text-lg text-gray-400 font-normal">pkt</span></div>
                        
                        <div class="bg-gray-50 rounded-lg p-4 text-left mb-6 max-h-48 overflow-y-auto">
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Do poprawy:</h3>
                            ${summary.list.length > 0 ? 
                                summary.list.map(item => `
                                    <div class="flex justify-between items-center py-1 border-b border-gray-100 last:border-0">
                                        <span class="font-mono font-bold text-gray-700">${item.key}</span>
                                        <span class="text-sm text-red-500 font-bold">${item.correct}/${item.attempts}</span>
                                    </div>
                                `).join('')
                                : '<div class="text-green-500 text-sm font-bold text-center">Wszystko super! 🎉</div>'
                            }
                        </div>

                        <button id="nextPhaseBtn" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all text-xl">
                            ${btnText}
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('nextPhaseBtn').onclick = nextAction;
        }

        function summarizeProgress() {
            const summaryList = [];
            for (const key in STATE.progress) {
                const stats = STATE.progress[key];
                if (stats.attempts > 0) {
                    const percentage = (stats.correct / stats.attempts) * 100;
                    if (percentage < 100) { // Pokazujemy każdy błąd w podsumowaniu
                        summaryList.push({ key, percentage, ...stats });
                    }
                }
            }
            summaryList.sort((a, b) => a.percentage - b.percentage);
            return { list: summaryList.slice(0, 5) };
        }

        // Init
        window.onload = () => {
            document.getElementById('startBtn').onclick = startDiagnosis;
        };
    </script>
</body>
</html>
